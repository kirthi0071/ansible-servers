---
- name: Discover cloud-init SSH authentication configuration files
  ansible.builtin.find:
    paths:
      - /etc/ssh/sshd_config.d
    patterns:
      - '*cloudimg*settings.conf'
    file_type: file
  register: cloudimg_ssh_files
  changed_when: false

- name: Enable password authentication in cloud-init SSH configuration
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^\s*#?\s*(PasswordAuthentication|KbdInteractiveAuthentication|UsePAM)\s+'
    line: '{{ item.1 }} yes'
    insertafter: EOF
  loop: "{{ cloudimg_ssh_files.files | product(['PasswordAuthentication', 'KbdInteractiveAuthentication', 'UsePAM']) | list }}"
  loop_control:
    label: "{{ item.0.path }} -> {{ item.1 }}"

- name: Remove previous Ansible SSH drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/00-ansible-password-auth.conf
    state: absent

- name: Configure password authentication in main sshd_config as a fallback
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*(PasswordAuthentication|KbdInteractiveAuthentication|UsePAM)\s+'
    line: '{{ item }} yes'
    insertafter: EOF
  loop:
    - PasswordAuthentication
    - KbdInteractiveAuthentication
    - UsePAM

- name: Validate SSH configuration before restart
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Restart SSH service to apply password authentication
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Verify effective SSH password authentication
  ansible.builtin.command: sshd -T
  register: sshd_effective_config
  changed_when: false
  check_mode: false

- name: Show effective SSH authentication settings
  ansible.builtin.debug:
    msg:
      - "{{ sshd_effective_config.stdout_lines | select('match', '^passwordauthentication ') | list }}"
      - "{{ sshd_effective_config.stdout_lines | select('match', '^kbdinteractiveauthentication ') | list }}"
      - "{{ sshd_effective_config.stdout_lines | select('match', '^usepam ') | list }}"

- name: Assert password authentication is enabled
  ansible.builtin.assert:
    that:
      - "'passwordauthentication yes' in sshd_effective_config.stdout | lower"
      - "'kbdinteractiveauthentication yes' in sshd_effective_config.stdout | lower"
      - "'usepam yes' in sshd_effective_config.stdout | lower"
    fail_msg: "Effective SSH configuration does not have password authentication enabled."
