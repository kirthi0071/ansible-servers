---
- name: Create managed local users
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /bin/bash
    create_home: true
    password: "{{ hostvars['localhost']['user_passwords'][item] | password_hash('sha512') }}"
    state: present
  loop: "{{ managed_users }}"
  no_log: true

- name: Configure password expiry policy
  ansible.builtin.user:
    name: "{{ item }}"
    password_expire_min: -1
    password_expire_max: 99999
  loop: "{{ managed_users }}"
  no_log: true
