---
- name: Prepare shared user credentials on the Ansible controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    managed_users:
      - ram
      - vicky
      - mahesh
    password_secret_project: "project-c98d2dac-2409-44bd-aba"
  tasks:
    - name: Run credential preparation tasks
      ansible.builtin.include_tasks: ../roles/users/tasks/controller_credentials.yml

- name: Manage standard local users on all VMs
  hosts: all
  become: true
  gather_facts: true
  vars:
    managed_users:
      - ram
      - vicky
      - mahesh
    password_secret_project: "project-c98d2dac-2409-44bd-aba"
  roles:
    - users
    - ssh
  post_tasks:
    - name: Verify managed users exist
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
      loop: "{{ managed_users }}"
      changed_when: false
