---
- name: Discover cloud-init SSH authentication configuration files
  ansible.builtin.find:
    paths:
      - /etc/ssh/sshd_config.d
    patterns:
      - '*cloudimg*settings.conf'
    file_type: file
  register: cloudimg_ssh_files
  changed_when: false

- name: Enable password authentication in every cloud-init SSH config file
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^([[:space:]]*#?[[:space:]]*)(PasswordAuthentication|KbdInteractiveAuthentication|UsePAM)([[:space:]]+)(yes|no)([[:space:]]*)$'
    replace: '\g<1>\g<2> yes\g<5>'
  loop: "{{ cloudimg_ssh_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure PasswordAuthentication is enabled in main sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*PasswordAuthentication\s+'
    line: 'PasswordAuthentication yes'
    insertafter: EOF

- name: Ensure KbdInteractiveAuthentication is enabled in main sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*KbdInteractiveAuthentication\s+'
    line: 'KbdInteractiveAuthentication yes'
    insertafter: EOF

- name: Ensure UsePAM is enabled in main sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*UsePAM\s+'
    line: 'UsePAM yes'
    insertafter: EOF

- name: Validate SSH configuration before restart
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Restart SSH service to apply password authentication
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Verify effective SSH password authentication
  ansible.builtin.command: sshd -T
  register: sshd_effective_config
  changed_when: false
  check_mode: false

- name: Show effective SSH authentication settings
  ansible.builtin.debug:
    msg:
      - "{{ sshd_effective_config.stdout_lines | select('match', '^passwordauthentication ') | list }}"
      - "{{ sshd_effective_config.stdout_lines | select('match', '^kbdinteractiveauthentication ') | list }}"
      - "{{ sshd_effective_config.stdout_lines | select('match', '^usepam ') | list }}"

- name: Assert password authentication is enabled
  ansible.builtin.assert:
    that:
      - "'passwordauthentication yes' in sshd_effective_config.stdout | lower"
      - "'kbdinteractiveauthentication yes' in sshd_effective_config.stdout | lower"
      - "'usepam yes' in sshd_effective_config.stdout | lower"
    fail_msg: "Effective SSH configuration does not have password authentication enabled."
