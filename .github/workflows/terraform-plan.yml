name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP with existing WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3

      - name: Bootstrap private Terraform state bucket
        env:
          GCP_PROJECT_ID: project-c98d2dac-2409-44bd-aba
          GCP_REGION: asia-south1
        run: |
          PROJECT_NUMBER=$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')
          STATE_BUCKET="ansible-servers-tfstate-${PROJECT_NUMBER}"
          if ! gcloud storage buckets describe "gs://${STATE_BUCKET}" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${STATE_BUCKET}" --project="$GCP_PROJECT_ID" --location="$GCP_REGION" --uniform-bucket-level-access --public-access-prevention
          fi
          gcloud storage buckets update "gs://${STATE_BUCKET}" --versioning
          echo "TF_STATE_BUCKET=$STATE_BUCKET" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=ansible-servers"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_bootstrap_ssh_public_key: 'ssh-ed25519 AAAA-placeholder-plan-key github-actions-plan'
          TF_VAR_github_actions_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: terraform plan -input=false
