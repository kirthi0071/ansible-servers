---
- name: Discover SSH authentication configuration files on each VM
  ansible.builtin.find:
    paths:
      - /etc/ssh/sshd_config.d
    patterns: '*.conf'
    file_type: file
  register: ssh_dropin_files
  changed_when: false

- name: Configure password authentication in sshd_config
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^([[:space:]]*)(PasswordAuthentication|KbdInteractiveAuthentication|UsePAM)([[:space:]]+)(yes|no)([[:space:]]*)$'
    replace: '\\g<1>\\g<2> yes'
  notify: Reload SSH

- name: Remove conflicting authentication directives from SSH drop-ins
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^([[:space:]]*)(PasswordAuthentication|KbdInteractiveAuthentication|UsePAM)([[:space:]]+)(yes|no)([[:space:]]*)$'
    replace: '# ANSIBLE_DISABLED \\g<0>'
  loop: "{{ ssh_dropin_files.files }}"
  when: item.path != '/etc/ssh/sshd_config.d/00-ansible-password-auth.conf'
  notify: Reload SSH

- name: Install final SSH authentication policy
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ansible-password-auth.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
      UsePAM yes
  notify: Reload SSH

- name: Validate SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Verify effective SSH password authentication
  ansible.builtin.command: sshd -T
  register: sshd_effective_config
  changed_when: false
  check_mode: false

- name: Show effective SSH password authentication settings
  ansible.builtin.debug:
    msg:
      - "{{ sshd_effective_config.stdout_lines | select('match', '^passwordauthentication ') | list }}"
      - "{{ sshd_effective_config.stdout_lines | select('match', '^kbdinteractiveauthentication ') | list }}"
      - "{{ sshd_effective_config.stdout_lines | select('match', '^usepam ') | list }}"

- name: Assert password authentication is enabled
  ansible.builtin.assert:
    that:
      - "'passwordauthentication yes' in sshd_effective_config.stdout | lower"
      - "'kbdinteractiveauthentication yes' in sshd_effective_config.stdout | lower"
      - "'usepam yes' in sshd_effective_config.stdout | lower"
    fail_msg: "Effective SSH configuration does not have the expected password authentication settings."
