---
- name: Check existing password secrets
  ansible.builtin.command:
    argv:
      - gcloud
      - secrets
      - versions
      - access
      - latest
      - "--secret={{ item }}-password"
      - "--project={{ password_secret_project }}"
  environment:
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
  register: secret_reads
  changed_when: false
  failed_when: false
  no_log: true
  loop: "{{ managed_users }}"

- name: Initialize password map from existing secrets
  ansible.builtin.set_fact:
    user_passwords: "{{ user_passwords | default({}) | combine({item.item: (item.stdout | trim)}) }}"
  loop: "{{ secret_reads.results }}"
  when: item.rc == 0 and (item.stdout | trim) != ""
  no_log: true

- name: Generate missing passwords
  ansible.builtin.shell: |
    python3 - <<'PY'
    import secrets, string
    user = {{ item.item | to_json }}
    words = ["Cedar", "Falcon", "Orbit", "River", "Quartz", "Summit", "Maple", "Harbor", "Comet", "Granite", "Meadow", "Rocket"]
    special = "!@#$%^&*"
    alphabet = string.ascii_letters + string.digits
    password = f"{secrets.choice(words)}-{user.capitalize()}-{secrets.randbelow(90)+10}{secrets.choice(special)}{''.join(secrets.choice(alphabet) for _ in range(8))}"
    print(password)
    PY
  args:
    executable: /bin/bash
  register: generated
  changed_when: true
  no_log: true
  loop: "{{ secret_reads.results }}"
  when: item.rc != 0 or (item.stdout | trim) == ""

- name: Add generated passwords to password map
  ansible.builtin.set_fact:
    user_passwords: "{{ user_passwords | default({}) | combine({item.item.item: (item.stdout | trim)}) }}"
  loop: "{{ generated.results | default([]) }}"
  when:
    - not (item.skipped | default(false))
    - item.rc == 0
    - item.stdout is defined
    - (item.stdout | trim) != ""
  no_log: true

- name: Store generated passwords in Secret Manager
  ansible.builtin.shell: |
    printf '%s' '{{ user_passwords[item.item.item] }}' | gcloud secrets versions add '{{ item.item.item }}-password' --project='{{ password_secret_project }}' --data-file=-
  args:
    executable: /bin/bash
  environment:
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
  loop: "{{ generated.results | default([]) }}"
  when:
    - not (item.skipped | default(false))
    - item.rc == 0
    - item.stdout is defined
    - (item.stdout | trim) != ""
  changed_when: true
  no_log: true

- name: Confirm all required passwords are available
  ansible.builtin.assert:
    that:
      - item in user_passwords
      - user_passwords[item] | length >= 16
    fail_msg: "No usable password is available for {{ item }}."
  loop: "{{ managed_users }}"
  no_log: true
