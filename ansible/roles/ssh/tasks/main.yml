---
- name: Inspect SSH configuration sources
  ansible.builtin.shell: |
    set -o pipefail
    grep -RniE '^[[:space:]]*(PasswordAuthentication|KbdInteractiveAuthentication|UsePAM)[[:space:]]+' /etc/ssh/sshd_config /etc/ssh/sshd_config.d 2>/dev/null || true
  args:
    executable: /bin/bash
  register: ssh_auth_config
  changed_when: false

- name: Configure SSH password authentication in sshd_config.d
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ansible-password-auth.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
      UsePAM yes
  notify: Reload SSH

- name: Disable conflicting SSH password-auth settings
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^\\s*(PasswordAuthentication|KbdInteractiveAuthentication|UsePAM)\\s+(no|yes)\\s*$'
    replace: '# ANSIBLE_DISABLED \\g<0>'
  loop:
    - /etc/ssh/sshd_config
  notify: Reload SSH

- name: Disable conflicting drop-in password-auth settings
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^\\s*(PasswordAuthentication|KbdInteractiveAuthentication|UsePAM)\\s+(no|yes)\\s*$'
    replace: '# ANSIBLE_DISABLED \\g<0>'
  loop: "{{ lookup('ansible.builtin.fileglob', '/etc/ssh/sshd_config.d/*.conf', wantlist=True) }}"
  when: item != '/etc/ssh/sshd_config.d/00-ansible-password-auth.conf'
  notify: Reload SSH

- name: Validate SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Verify effective SSH password authentication
  ansible.builtin.command: sshd -T
  register: sshd_effective_config
  changed_when: false
  check_mode: false

- name: Show effective SSH password authentication settings
  ansible.builtin.debug:
    msg:
      - "{{ sshd_effective_config.stdout_lines | select('match', '^passwordauthentication ') | list }}"
      - "{{ sshd_effective_config.stdout_lines | select('match', '^kbdinteractiveauthentication ') | list }}"
      - "{{ sshd_effective_config.stdout_lines | select('match', '^usepam ') | list }}"

- name: Assert password authentication is enabled
  ansible.builtin.assert:
    that:
      - "'passwordauthentication yes' in sshd_effective_config.stdout | lower"
      - "'kbdinteractiveauthentication yes' in sshd_effective_config.stdout | lower"
      - "'usepam yes' in sshd_effective_config.stdout | lower"
    fail_msg: "Effective SSH configuration does not have the expected password authentication settings."
